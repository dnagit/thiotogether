<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Bebas Neue — the display face on the profile poster's pills. Linked here rather than
      @import-ed from the stylesheet so the browser can start fetching it while the CSS is
      still parsing, and preconnected so the handshake with Google's font host does not wait
      for the stylesheet to arrive first.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />

    <!--
      Fallback metadata for clients that do not run JavaScript. Live values come
      from the CMS and are written by applySeo() once the app boots; link-preview
      scrapers are served the real per-page tags by the API instead (see
      /api/v1/public/share-preview). This block only has to make sure anything
      that reaches neither still sees the site name rather than a placeholder.
      The values are substituted from VITE_SITE_* at build time — see
      vite.config.ts.
    -->
    <title>%SITE_NAME%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_NAME%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_IMAGE%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_NAME%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_IMAGE%" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
