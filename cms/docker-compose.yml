version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cms_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms -d cms']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://cms:${DB_PASSWORD:-cms_password}@postgres:5432/cms?schema=public
      APP_URL: ${APP_URL:-http://localhost:4000}
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost:8080}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:8081}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
    volumes:
      - uploads:/app/api/uploads
    ports:
      - '4000:4000'

  website:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        APP: website
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '8080:80'

  admin:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        APP: admin
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '8081:80'

volumes:
  postgres-data:
  uploads:
