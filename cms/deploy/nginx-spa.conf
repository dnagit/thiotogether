# Link-preview scrapers do not run JavaScript, so they read index.html and never
# see the tags applySeo() writes at runtime. Route just those user agents to the
# API, which renders the real Open Graph tags for the requested path.
# Search engines are left alone on purpose — they execute the SPA, and serving
# them different markup would be cloaking.
map $http_user_agent $cms_is_scraper {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|line-poker|LINE|Slackbot|Discordbot|TelegramBot|WhatsApp|Pinterest|SkypeUriPreview|vkShare|redditbot|Iframely|Embedly)" 1;
}

# A scraper also fetches the og:image itself. Anything with a file extension is a
# real asset and must be served from disk, never rewritten to the preview HTML.
map $uri $cms_is_page {
    default 1;
    "~\."   0;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets, never cache the HTML shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # `return` inside `if` is the one form that composes safely with
        # try_files; 418 is just an unused code used to reach the named location.
        error_page 418 = @share_preview;
        if ($cms_is_scraper$cms_is_page = 11) {
            return 418;
        }

        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location @share_preview {
        proxy_pass http://api:4009/api/v1/public/share-preview?path=$uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A scraper must never be left with a broken card because the API is
        # slow or down; fall back to the static shell instead.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
