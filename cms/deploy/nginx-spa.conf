# Link-preview scrapers do not run JavaScript, so they read index.html and never
# see the tags applySeo() writes at runtime. Route just those user agents to the
# API, which renders the real Open Graph tags for the requested path.
# Search engines are left alone on purpose — they execute the SPA, and serving
# them different markup would be cloaking.
#
# Every alternative below must name a bot, never an app: an app's in-app browser
# carries the app's name too, and matching it locks real people out of the site
# entirely. The preview page carries a <meta http-equiv="refresh"> back to the
# same URL, so a human routed here arrives with the same user agent, is routed
# here again, and loops forever. `LINE` did exactly that — LINE's in-app browser
# sends `... Line/13.5.0`, while its preview bot sends
# `facebookexternalhit/1.1;line-poker/1.0`, already covered by the first two.
map $http_user_agent $cms_is_scraper {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|line-poker|Slackbot|Discordbot|TelegramBot|WhatsApp/|Pinterestbot|Pinterest/0\.|SkypeUriPreview|vkShare|redditbot|Iframely|Embedly)" 1;
}

# A scraper also fetches the og:image itself. Anything with a file extension is a
# real asset and must be served from disk, never rewritten to the preview HTML.
map $uri $cms_is_page {
    default 1;
    "~\."   0;
}

# `if` takes a single variable and does not concatenate: nginx reads
# `$a$b` as one variable literally named `a$b` and refuses to start. Combine
# the two flags here, where a map source may hold text and variables.
map "$cms_is_scraper$cms_is_page" $cms_share_preview {
    default 0;
    "11"    1;
}

# A proxy_pass containing a variable is resolved per request, not at startup,
# and nginx then demands a `resolver` for the hostname — without this block
# every preview request fails with "no resolver defined to resolve api". A
# named upstream is looked up before DNS, so the variable in the query string
# below stays harmless.
upstream cms_api {
    server api:4009;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The preview location is itself reached through an error_page, which marks
    # the request as one and makes nginx ignore any further error_page. Without
    # this the API-down fallback below never fires and the scraper gets a raw
    # 504 page — the broken card that fallback exists to prevent.
    recursive_error_pages on;

    # Long-cache hashed assets, never cache the HTML shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # `return` inside `if` is the one form that composes safely with
        # try_files; 418 is just an unused code used to reach the named location.
        error_page 418 = @share_preview;
        if ($cms_share_preview) {
            return 418;
        }

        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location @share_preview {
        proxy_pass http://cms_api/api/v1/public/share-preview?path=$uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A scraper must never be left with a broken card because the API is
        # slow or down; fall back to the static shell instead.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_shell;
    }

    # The fallback must be a named location, not /index.html: nginx caches map
    # values for the life of a request, so re-entering `location /` would still
    # see $cms_share_preview = 1, bounce back here, and spin until nginx gives
    # up with a 500.
    location @spa_shell {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
